<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Abstract Submitted | Cerebellum Neuroimaging Symposium 2027</title>
  <style>
    :root{--ink:#14213d;--muted:#607080;--line:#dfe6ec;--soft:#f5f8fa;--primary:#0b7285;--primary-dark:#075a69}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--soft);line-height:1.55}
    .container{width:min(calc(100% - 32px),760px);margin:auto}.wrap{min-height:100vh;display:grid;place-items:center;padding:40px 0}
    .card{background:#fff;border:1px solid var(--line);border-top:6px solid var(--primary);padding:42px;box-shadow:0 18px 45px rgba(20,33,61,.08)}
    .check{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#dff3f5;color:var(--primary);font-size:30px;font-weight:800}
    h1{font-family:Georgia,'Times New Roman',serif;font-size:42px;line-height:1.05;letter-spacing:-.035em;margin:22px 0 14px}
    p{color:var(--muted);font-size:17px}.btn{display:inline-flex;min-height:46px;padding:0 19px;align-items:center;background:var(--primary);color:#fff;text-decoration:none;font-weight:800;border-radius:4px;margin-top:12px}.btn:hover{background:var(--primary-dark)}
  </style>
</head>
<body>
  <div class="wrap">
    <main class="container card">
      <div class="check">✓</div>
      <h1>Thank you for your submission.</h1>
      <p>Your abstract has been sent to the organising committee of the Cerebellum Neuroimaging Symposium 2027.</p>
      <p>Please keep the confirmation email for your records. The presenting author will be contacted after the review process.</p>
      <a class="btn" href="index.html">Return to the symposium website</a>
    </main>
  </div>
</body>
</html>
