name: Open abstract submissions

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link public abstract submission form
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          registration_button = '        <a class="btn interest" href="https://events.humanitix.com/cerebellum-neuroimaging-symposium-2027" target="_blank" rel="noopener noreferrer">Register now</a>'
          abstract_button = registration_button + '\n        <a class="btn primary" href="abstract-submission.html">Submit abstract</a>'
          if 'href="abstract-submission.html">Submit abstract</a>' not in html:
              if registration_button not in html:
                  raise SystemExit('Registration hero button not found')
              html = html.replace(registration_button, abstract_button, 1)
          card_pattern = re.compile(r'      <article class="date-card">\s*<span class="status">Opening soon</span>\s*<strong>Abstract Submission</strong>\s*<span>Submission guidelines and deadlines will be announced\.</span>\s*</article>', re.S)
          new_card = base64.b64decode('ICAgICAgPGFydGljbGUgY2xhc3M9ImRhdGUtY2FyZCI+CiAgICAgICAgPHNwYW4gY2xhc3M9InN0YXR1cyBvcGVuIj5PcGVuIG5vdzwvc3Bhbj4KICAgICAgICA8c3Ryb25nPkFic3RyYWN0IFN1Ym1pc3Npb248L3N0cm9uZz4KICAgICAgICA8c3Bhbj5TdWJtaXNzaW9uIGRlYWRsaW5lOiBKYW51YXJ5IDMxLCAyMDI3Ljwvc3Bhbj4KICAgICAgPC9hcnRpY2xlPg==').decode('utf-8')
          html, card_count = card_pattern.subn(new_card, html, count=1)
          if card_count != 1:
              raise SystemExit(f'Expected one abstract date card, changed {card_count}')
          abstract_pattern = re.compile(r'<section id="abstracts">.*?</section>\s*\n\s*<section id="registration"', re.S)
          new_abstract = base64.b64decode('').decode('utf-8')
          html, section_count = abstract_pattern.subn(new_abstract, html, count=1)
          if section_count != 1:
              raise SystemExit(f'Expected one abstract section, changed {section_count}')
          path.write_text(html, encoding='utf-8')
          readme = base64.b64decode('').decode('utf-8')
          Path('README.md').write_text(readme, encoding='utf-8')
          PY

      - name: Commit site update and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/open-abstract-submission.yml
          git add index.html README.md
          git commit -m "Open abstract submissions"
          git push
