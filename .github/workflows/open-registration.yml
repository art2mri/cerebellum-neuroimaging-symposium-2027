name: Open symposium registration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-registration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace Expression of Interest with registration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')

          old_url = 'https://forms.gle/rCNTC6VUyXUfFH4u8'
          registration_url = 'https://events.humanitix.com/cerebellum-neuroimaging-symposium-2027'

          if old_url not in html:
              raise SystemExit('Expression of Interest URL was not found in index.html')
          html = html.replace(old_url, registration_url)

          html = html.replace(
              '>Expression of Interest</a>',
              '>Register now</a>',
              1,
          )

          old_band = '''<section class="interest-band" aria-label="Expression of Interest">
  <div class="container interest-wrap">
    <div>
      <p class="kicker">Expression of Interest now open</p>
      <h2>Interested in joining us in Campinas?</h2>
      <p>Complete the Expression of Interest form for the Cerebellum Neuroimaging Symposium 2027.</p>
    </div>
    <a class="btn interest" href="https://events.humanitix.com/cerebellum-neuroimaging-symposium-2027" target="_blank" rel="noopener noreferrer">Complete the form →</a>
  </div>
</section>'''
          new_band = '''<section class="interest-band" aria-label="Registration">
  <div class="container interest-wrap">
    <div>
      <p class="kicker">Registration now open</p>
      <h2>Join us in Campinas in April 2027.</h2>
      <p>Registration is now open for the Cerebellum Neuroimaging Symposium 2027.</p>
    </div>
    <a class="btn interest" href="https://events.humanitix.com/cerebellum-neuroimaging-symposium-2027" target="_blank" rel="noopener noreferrer">Register now →</a>
  </div>
</section>'''
          if old_band not in html:
              raise SystemExit('Expression of Interest banner was not found')
          html = html.replace(old_band, new_band, 1)

          old_interest_card = '''      <article class="date-card">
        <span class="status open">Open now</span>
        <strong>Expression of Interest</strong>
        <span>Tell us you are interested in joining the symposium in Campinas.</span>
      </article>'''
          new_registration_card = '''      <article class="date-card">
        <span class="status open">Open now</span>
        <strong>Registration</strong>
        <span>Register for the symposium through the official Humanitix page.</span>
      </article>'''
          if old_interest_card not in html:
              raise SystemExit('Expression of Interest date card was not found')
          html = html.replace(old_interest_card, new_registration_card, 1)

          old_registration_card = '''      <article class="date-card">
        <span class="status">Opening soon</span>
        <strong>Registration</strong>
        <span>Registration categories, fees and workshop options will be announced.</span>
      </article>
'''
          if old_registration_card not in html:
              raise SystemExit('Old registration date card was not found')
          html = html.replace(old_registration_card, '', 1)
          html = html.replace(
              '.important-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }',
              '.important-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }',
              1,
          )

          old_registration_section = '''<section id="registration" class="soft">
  <div class="container split">
    <div>
      <p class="kicker">Join us in Campinas</p>
      <h2>Registration</h2>
    </div>
    <div class="coming-panel">
      <span class="meta">Opening soon</span>
      <h3>Registration details will be announced here.</h3>
      <p>Registration categories, fees, eligibility information and participation options will be published when online registration opens. Information about participation in the hands-on MRI workshop will be included at the same time.</p>
      <span class="btn disabled" aria-disabled="true">Registration · Opening soon</span>
    </div>
  </div>
</section>'''
          new_registration_section = '''<section id="registration" class="soft">
  <div class="container split">
    <div>
      <p class="kicker">Join us in Campinas</p>
      <h2>Registration</h2>
    </div>
    <div class="coming-panel">
      <span class="meta">Registration open</span>
      <h3>Reserve your place for the symposium.</h3>
      <p>Registration for the Cerebellum Neuroimaging Symposium 2027 is now available through Humanitix. Visit the official registration page for ticket options and current event information.</p>
      <a class="btn interest" href="https://events.humanitix.com/cerebellum-neuroimaging-symposium-2027" target="_blank" rel="noopener noreferrer">Register now →</a>
    </div>
  </div>
</section>'''
          if old_registration_section not in html:
              raise SystemExit('Old registration section was not found')
          html = html.replace(old_registration_section, new_registration_section, 1)

          old_updates = '''<section id="updates">
  <div class="container split">
    <div>
      <p class="kicker">Stay informed</p>
      <h2>Be the first to hear about registration and abstracts.</h2>
    </div>
    <div class="copy">
      <p>Registration and abstract submission are not open yet. In the meantime, let us know you are interested in attending the Cerebellum Neuroimaging Symposium 2027.</p>
      <a class="btn interest" href="https://events.humanitix.com/cerebellum-neuroimaging-symposium-2027" target="_blank" rel="noopener noreferrer">Expression of Interest</a>
    </div>
  </div>
</section>'''
          new_updates = '''<section id="updates">
  <div class="container split">
    <div>
      <p class="kicker">Registration open</p>
      <h2>Reserve your place in Campinas.</h2>
    </div>
    <div class="copy">
      <p>Registration for the Cerebellum Neuroimaging Symposium 2027 is now open through Humanitix. Abstract submission will open separately.</p>
      <a class="btn interest" href="https://events.humanitix.com/cerebellum-neuroimaging-symposium-2027" target="_blank" rel="noopener noreferrer">Register now →</a>
    </div>
  </div>
</section>'''
          if old_updates not in html:
              raise SystemExit('Old updates section was not found')
          html = html.replace(old_updates, new_updates, 1)

          if 'Expression of Interest' in html or old_url in html:
              raise SystemExit('An Expression of Interest reference remains in index.html')

          index_path.write_text(html, encoding='utf-8')

          readme = '''# Cerebellum Neuroimaging Symposium 2027

Official website repository for the **Cerebellum Neuroimaging Symposium 2027**, an international scientific meeting focused on cerebellar imaging, clinical translation, and trial-ready biomarkers.

## Live website

Access the public site here:

**https://art2mri.github.io/cerebellum-neuroimaging-symposium-2027/**

## Registration

Registration is now open through Humanitix:

**https://events.humanitix.com/cerebellum-neuroimaging-symposium-2027**

## Current website contents

The website currently includes:
- active **Registration** links to the official Humanitix page
- **Important Dates** section
- confirmed keynote speakers and speaker photos
- preliminary three-day scientific program
- dedicated **Abstract Submission** section marked as opening soon
- hands-on MRI workshop venue at **Hospital de Clínicas da UNICAMP (HC)**
- main symposium venue at **IOU, University of Campinas** with Google Maps access
- **Travel & Accommodation** recommendations and transportation guidance
- Steering Committee with member photos and **Co-Chair** tags for Thiago Rezende and Ian Harding
- confirmed sponsors: **Friedreich's Ataxia Research Alliance (FARA)** and **Ataxia Global Initiative (AGI)**

## Repository structure

Main files:
- `index.html`
- `assets/`
- `README.md`

## Abstract submission

The current **Opening soon** placeholder can be replaced by a direct link to the selected abstract-submission platform when submissions open.

## Updating the site

GitHub Pages publishes the website directly from the repository.
After editing and pushing changes to the `main` branch, the live website is updated automatically.
'''
          Path('README.md').write_text(readme, encoding='utf-8')
          PY

      - name: Commit registration update and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/open-registration.yml
          git add index.html README.md
          git commit -m "Open symposium registration through Humanitix"
          git push
