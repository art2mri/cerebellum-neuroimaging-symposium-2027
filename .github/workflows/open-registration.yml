name: Open symposium registration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-registration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply registration updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          registration_url = "https://events.humanitix.com/cerebellum-neuroimaging-symposium-2027"
          old_url = "https://forms.gle/rCNTC6VUyXUfFH4u8"
          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")

          if old_url not in html:
              raise SystemExit("Old Expression of Interest URL not found")

          html = html.replace(old_url, registration_url)
          html = html.replace('aria-label="Expression of Interest"', 'aria-label="Registration"')
          html = html.replace('>Expression of Interest</a>', '>Register now</a>')
          html = html.replace('Expression of Interest now open', 'Registration now open')
          html = html.replace('Interested in joining us in Campinas?', 'Join us in Campinas in April 2027.')
          html = html.replace('Complete the Expression of Interest form for the Cerebellum Neuroimaging Symposium 2027.', 'Registration is now open for the Cerebellum Neuroimaging Symposium 2027.')
          html = html.replace('Complete the form →', 'Register now →')
          html = html.replace('<strong>Expression of Interest</strong>', '<strong>Registration</strong>')
          html = html.replace('Tell us you are interested in joining the symposium in Campinas.', 'Register for the symposium through the official Humanitix page.')

          duplicate_card = r'\n\s*<article class="date-card">\s*<span class="status">Opening soon</span>\s*<strong>Registration</strong>\s*<span>Registration categories, fees and workshop options will be announced\.</span>\s*</article>'
          html, removed = re.subn(duplicate_card, '', html, count=1, flags=re.S)
          if removed != 1:
              raise SystemExit("Duplicate registration date card not found")

          html = html.replace('grid-template-columns:repeat(4,1fr);', 'grid-template-columns:repeat(3,1fr);', 1)

          registration_replacement = "\n".join([
              '<section id="registration" class="soft">',
              '  <div class="container split">',
              '    <div>',
              '      <p class="kicker">Join us in Campinas</p>',
              '      <h2>Registration</h2>',
              '    </div>',
              '    <div class="coming-panel">',
              '      <span class="meta">Registration open</span>',
              '      <h3>Reserve your place for the symposium.</h3>',
              '      <p>Registration for the Cerebellum Neuroimaging Symposium 2027 is now available through Humanitix. Visit the official registration page for ticket options and current event information.</p>',
              f'      <a class="btn interest" href="{registration_url}" target="_blank" rel="noopener noreferrer">Register now →</a>',
              '    </div>',
              '  </div>',
              '</section>',
          ])
          html, replaced = re.subn(r'<section id="registration" class="soft">.*?</section>', registration_replacement, html, count=1, flags=re.S)
          if replaced != 1:
              raise SystemExit("Registration section not found")

          updates_replacement = "\n".join([
              '<section id="updates">',
              '  <div class="container split">',
              '    <div>',
              '      <p class="kicker">Registration open</p>',
              '      <h2>Reserve your place in Campinas.</h2>',
              '    </div>',
              '    <div class="copy">',
              '      <p>Registration for the Cerebellum Neuroimaging Symposium 2027 is now open through Humanitix. Abstract submission will open separately.</p>',
              f'      <a class="btn interest" href="{registration_url}" target="_blank" rel="noopener noreferrer">Register now →</a>',
              '    </div>',
              '  </div>',
              '</section>',
          ])
          html, replaced = re.subn(r'<section id="updates">.*?</section>', updates_replacement, html, count=1, flags=re.S)
          if replaced != 1:
              raise SystemExit("Updates section not found")

          if "Expression of Interest" in html or old_url in html:
              raise SystemExit("Expression of Interest reference remains")

          index_path.write_text(html, encoding="utf-8")

          readme_lines = [
              '# Cerebellum Neuroimaging Symposium 2027',
              '',
              'Official website repository for the **Cerebellum Neuroimaging Symposium 2027**, an international scientific meeting focused on cerebellar imaging, clinical translation, and trial-ready biomarkers.',
              '',
              '## Live website',
              '',
              'Access the public site here:',
              '',
              '**https://art2mri.github.io/cerebellum-neuroimaging-symposium-2027/**',
              '',
              '## Registration',
              '',
              'Registration is now open through Humanitix:',
              '',
              f'**{registration_url}**',
              '',
              '## Current website contents',
              '',
              'The website currently includes:',
              '- active **Registration** links to the official Humanitix page',
              '- **Important Dates** section',
              '- confirmed keynote speakers and speaker photos',
              '- preliminary three-day scientific program',
              '- dedicated **Abstract Submission** section marked as opening soon',
              '- hands-on MRI workshop venue at **Hospital de Clínicas da UNICAMP (HC)**',
              '- main symposium venue at **IOU, University of Campinas** with Google Maps access',
              '- **Travel & Accommodation** recommendations and transportation guidance',
              '- Steering Committee with member photos and **Co-Chair** tags for Thiago Rezende and Ian Harding',
              '- confirmed sponsors: **Friedreich\'s Ataxia Research Alliance (FARA)** and **Ataxia Global Initiative (AGI)**',
              '',
              '## Repository structure',
              '',
              'Main files:',
              '- `index.html`',
              '- `assets/`',
              '- `README.md`',
              '',
              '## Abstract submission',
              '',
              'The current **Opening soon** placeholder can be replaced by a direct link to the selected abstract-submission platform when submissions open.',
              '',
              '## Updating the site',
              '',
              'GitHub Pages publishes the website directly from the repository.',
              'After editing and pushing changes to the `main` branch, the live website is updated automatically.',
              '',
          ]
          Path("README.md").write_text("\n".join(readme_lines), encoding="utf-8")
          PY

      - name: Commit registration update and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/open-registration.yml
          git add index.html README.md
          git commit -m "Open symposium registration through Humanitix"
          git push
