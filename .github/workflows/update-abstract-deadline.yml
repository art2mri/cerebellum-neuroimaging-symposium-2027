name: Update abstract deadline

on:
  push:
    paths:
      - '.github/workflows/update-abstract-deadline.yml'

permissions:
  contents: write

jobs:
  update-deadline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace deadline text
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'January 31, 2027': 'January 15, 2027',
              '2027-01-31T23:59:59-03:00': '2027-01-15T23:59:59-03:00',
          }
          targets = [Path('index.html'), Path('README.md')]
          for extra in [Path('apps-script'), Path('appsscript')]:
              if extra.exists():
                  targets.extend(p for p in extra.rglob('*') if p.is_file())

          changed = []
          for path in targets:
              if not path.exists():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, replacement in replacements.items():
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No deadline text was found to replace.')
          print('Updated:', ', '.join(changed))
          PY

      - name: Commit updated deadline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md apps-script appsscript 2>/dev/null || true
          git commit -m 'Change abstract submission deadline to January 15, 2027'
          git push
