name: Add NAF sponsor

on:
  push:
    paths:
      - '.github/workflows/add-naf-sponsor.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add NAF logo and sponsor card
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          logo_b64 = ''''''

          assets = Path('assets')
          assets.mkdir(exist_ok=True)
          (assets / 'naf.png').write_bytes(base64.b64decode(logo_b64))

          index_path = Path('index.html')
          text = index_path.read_text(encoding='utf-8')

          old_grid = '.sponsor-grid { display:grid; grid-template-columns: repeat(2, minmax(260px, 1fr)); gap: 22px; max-width: 860px; margin: 0 auto; }'
          new_grid = '.sponsor-grid { display:grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 22px; max-width: 1100px; margin: 0 auto; }'
          text = text.replace(old_grid, new_grid)

          if 'National Ataxia Foundation' not in text:
              agi_card = '''      <article class="sponsor-card">
        <div class="sponsor-logo-wrap"><img class="sponsor-logo" src="assets/agi.png" alt="Ataxia Global Initiative (AGI) logo"></div>
        <h3>Ataxia Global Initiative</h3>
      </article>
'''
              naf_card = '''      <article class="sponsor-card">
        <div class="sponsor-logo-wrap"><img class="sponsor-logo" src="assets/naf.png" alt="National Ataxia Foundation (NAF) logo"></div>
        <h3>National Ataxia Foundation</h3>
      </article>
'''
              if agi_card not in text:
                  raise SystemExit('Could not locate the AGI sponsor card in index.html')
              text = text.replace(agi_card, agi_card + naf_card)

          index_path.write_text(text, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('confirmed sponsors FARA and AGI', 'confirmed sponsors FARA, AGI and NAF')
          readme_path.write_text(readme, encoding='utf-8')

          if 'National Ataxia Foundation' not in text or 'assets/naf.png' not in text:
              raise SystemExit('NAF sponsor insertion validation failed')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md assets/naf.png
          git commit -m 'Add National Ataxia Foundation as sponsor'
          git push
