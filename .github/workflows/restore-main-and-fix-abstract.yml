name: Restore symposium site and fix abstract page

on:
  push:
    paths:
      - '.github/workflows/restore-main-and-fix-abstract.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore homepage and repair abstract links
        run: |
          git show b305d525acdb135586d61c49e30153a1a7182aab:index.html > index.html
          python - <<'PY'
          from pathlib import Path
          import re

          app_url = 'https://script.google.com/macros/s/AKfycbwlPE1hTAZfX9sOHoq4Z5oPZucKKnAcLwbAwYrkFljH81HnVh9vMc677I-AoZWqF3JHVg/exec'
          stable_page = 'abstract-submission.html'
          stable_public_url = 'https://art2mri.github.io/cerebellum-neuroimaging-symposium-2027/abstract-submission.html'

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace(
              f'href="{app_url}" target="_blank" rel="noopener noreferrer"',
              f'href="{stable_page}"'
          )
          text = text.replace(
              'Registration for the Cerebellum Neuroimaging Symposium 2027 is now open through Humanitix. Abstract submission will open separately.',
              'Registration and abstract submission for the Cerebellum Neuroimaging Symposium 2027 are now open.'
          )
          index.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          r = re.sub(r'https://script\.google\.com/macros/s/[^\s*]+/exec', stable_public_url, r)
          readme.write_text(r, encoding='utf-8')

          abstract_page = Path('abstract-submission.html').read_text(encoding='utf-8')
          if app_url not in abstract_page:
              raise SystemExit('abstract-submission.html does not point to the expected Apps Script deployment.')
          if '<title>Cerebellum Neuroimaging Symposium 2027</title>' not in text:
              raise SystemExit('Expected symposium homepage title not found.')
          if '<title>CNS2027 Abstract Submission</title>' in text:
              raise SystemExit('The submission form is still present in index.html.')
          if text.count('href="abstract-submission.html"') < 2:
              raise SystemExit('Expected at least two stable abstract links in index.html.')
          PY

      - name: Commit repaired files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md
          git commit -m 'Restore symposium homepage and repair abstract links'
          git push
