name: Add abstract scope guidance

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-form:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add guidelines from the submission template
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          path = Path('abstract-submission.html')
          html = path.read_text(encoding='utf-8')
          old = base64.b64decode('').decode('utf-8')
          new = base64.b64decode('').decode('utf-8')
          if old not in html:
              raise SystemExit('Submission deadline notice not found')
          html = html.replace(old, new, 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-abstract-guidelines.yml
          git add abstract-submission.html
          git commit -m "Add abstract scope and eligibility guidance"
          git push
